- author: "Anonymní"
  date: 2013-04-10T08:16:40.903+02:00
  text: "Já jsem spíš zvědav, co se vyklube z prohlášení, že od středy není ručeno za bezpečnost velvyslanců v KLDR..."
- author: "Anonymní"
  date: 2013-04-10T13:22:14.692+02:00
  text: "Už v roce 2009 byl provoz téhle průmyslové zóny přerušen, takže tahle situace není úplně nová. KLDR prostě jen stupňuje vydírání. Ještě se chystají (IMHO) odpálit tu raketu středního doletu, pak se uvidí, co dál. Jinak možný vývoj Kesongu: 1. Korea dá projekt k ledu (KLDR se s Koreou nedohodne) a místo Korejců přijdou Číňani. 2. Pojede se dál, jako doposud, jen si KLDR &quot;vyjedná&quot; vyšší mzdy pro svoje dělníky (bude jim moc sebrat víc peněz). Tak jako tak na tom KLDR nebude tratit.<br />Pavel Mareš"
