  text: "Moc krásně čtivý článek, díky za něj!"
- author: "Jana"
  date: 2013-02-02T17:20:25.161+01:00
  text: "Super blog, taky mě nějakým zvráceným způsobem KLDR zajímá :D"
- author: "Anonymní"
  date: 2013-03-27T11:19:57.273+01:00
  text: "Hezkej článek, díky za něj.Škoda že nejsou okomentovaný fotky. Co se týká masa, četl jem článek v ruštině od jistého Tarase, ten psal že psí maso by jim naservírovali také, ale to  bylo na požádání."
- author: "Anonymní"
  date: 2013-03-27T11:38:56.240+01:00
  text: "Tak ja mam fotky okomentovane - zkusim to sem dat a uvidime."
- author: "Anonymní"
  date: 2013-03-30T10:21:08.999+01:00
  text: "Krásně jsem si počet. Je to fakt zajímavý a díky za ty informace. Dobře jsem se bavil, ale zároveň je to smutný. To přirovnání - země šťastných otroků&quot; je trefný. Jejich štěstí je vykoupeno nevědomostí, jejíž příčinou jsou lži a omezování lidských práv. Jinak by to byli asi normální přátelští lidé. Jsou zblbnutí režimem - však jsme to taky poznali. Tuhle zkušenost obyčejného lidství západní lidé nemají. Obávám se, že současný mladý vůdce začal se světem hrát videohru, kterou v duchu minulého století připravili jeho předchůdci."
- author: "Anonymní"
  date: 2013-03-30T16:32:13.754+01:00
  text: "Krasne sepsanej cestopis, dost me bavil tvuj zpusob psani a ten jemnej ironickej nadech. Diky za zajimavy cteni a big up za to, zes takovou cestu vubec &quot;sam&quot; vykonal."
- author: "Anonymní"
  date: 2013-04-04T11:02:25.482+02:00
  text: "Parádní čtení, i když zároveň velmi smutný. A to jste ještě viděli jen to lepší :-("
- author: "Anonymní"
  date: 2013-04-07T17:04:37.096+02:00
  text: "Přiznám se, že jsem cestopis začala číst s pocitem, jak budete vychvalovat &quot;dastižénija&quot; Severokorejců a tepat věrolomnost imperialistů a já po pár větách skončím, ale přečetla jsem to téměř bez dechu na jeden zátah. Děkuji."
