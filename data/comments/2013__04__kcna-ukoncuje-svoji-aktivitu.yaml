- author: "Anonymní"
  date: 2013-04-01T21:34:57.777+02:00
  text: "V první chvíli jsem tomu uvěřil, ale pak mi došlo kolikátého je :D"
- author: "Anonymní"
  date: 2013-04-02T16:22:32.043+02:00
  text: "Tak me hlavne potesilo, ze jsem mohl prestat prekladat (stejne nikdo nevi, kdy si Korejci delaji aprila a kdy to mysli vazne) a trochu zaimprovizovat. Hlavne jsem pysnej na ten seznam povolenych slov :-)"
- author: "Anonymní"
  date: 2013-04-03T14:17:50.241+02:00
  text: "On je celý ten příspěvek psán tím specifickým korejským stylem o &quot;nesrovnatelně velkých mužích&quot; a &quot;...bude více vhodná...&quot; :D , je to hodně věrohodné, gratulace :)"
