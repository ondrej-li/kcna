- author: "Anonymní"
  date: 2013-04-05T16:56:12.046+02:00
  text: "Komentář ke komentáři:<br />Na jednu stranu máš pravdu v tom, že KLDR dává halasně najevo, že má atom, nicméně má to další roviny: zmínky o zmenšených, zlehčených a různorodých atomových zbraní znamenají, že nic takového nemají. A hlavně, USA, Čína i Rusko si uvědomují, že jestliže se KLDR podaří vyvinout/vyměnit/ukrást takové zmenšené atomové zbraně (aby se jim vešly do hlavic raket), bude to průser. Proto to (IMHO) nikdy nedopustí.<br />Pavel Mareš"
