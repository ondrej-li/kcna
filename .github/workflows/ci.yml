name: CI

# The site is deployed from the VPS, but it is built here first: the box only
# needs the rendered output, and a broken layout should never reach it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hugo:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"

      - name: Build
        run: hugo --minify --cleanDestinationDir -d "$RUNNER_TEMP/public"

      - name: Check the Blogger import tool still parses
        run: python3 -m compileall -q tools
