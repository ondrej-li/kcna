# kcna.ondralinek.cz — static Hugo build of the KCNA blog archive.
# Installed as /etc/nginx/sites-available/kcna by deploy/deploy.sh.
# Source of truth: https://github.com/ondrej-li/kcna/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name kcna.ondralinek.cz;

    # Let's Encrypt renews through this path, so it must never be redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/kcna;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kcna.ondralinek.cz;
    include snippets/methods-read-only.conf;
    include snippets/block-scanner-paths.conf;

    root /var/www/kcna;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/kcna.ondralinek.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kcna.ondralinek.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kcna.access.log;
    error_log  /var/log/nginx/kcna.error.log;

    include /etc/nginx/snippets/kcna-headers.conf;

    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Posts keep the exact Blogger paths: /YYYY/MM/slug.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Old Blogger shapes that still appear in links, bookmarks and feed readers.
    location = /feeds/posts/default {
        return 301 /index.xml;
    }

    location ^~ /feeds/ {
        return 410;
    }

    location = /popisky/ {
        return 301 /popisky.html;
    }

    location ^~ /search/label/ {
        return 301 /popisky.html;
    }

    # Blogger month archives (/2016/05/) have no equivalent page; the archive
    # page lists every month instead.
    location ~ "^/20[0-9]{2}(/[0-9]{2})?/?$" {
        return 301 /archiv.html;
    }

    # Pages are never cached, so a deploy is visible immediately. Their assets
    # carry a content hash in the URL and can be cached for a long time.
    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
        include /etc/nginx/snippets/kcna-headers.conf;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        include /etc/nginx/snippets/kcna-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
