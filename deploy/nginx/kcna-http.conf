# kcna.ondralinek.cz — HTTP only, used until the TLS certificate exists.
# deploy/enable-tls.sh swaps this for kcna.conf once DNS points at the server.
# Source of truth: https://github.com/ondrej-li/kcna/tree/main/deploy

server {
    listen 80;
    listen [::]:80;
    server_name kcna.ondralinek.cz;

    root /var/www/kcna;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/kcna.access.log;
    error_log  /var/log/nginx/kcna.error.log;

    # Plain HTTP headers only: HSTS and upgrade-insecure-requests belong to the
    # TLS vhost and would break the site while it is still served over HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Old Blogger shapes that still appear in links, bookmarks and feed readers.
    location = /feeds/posts/default {
        return 301 /index.xml;
    }

    location ^~ /feeds/ {
        return 410;
    }

    location = /popisky/ {
        return 301 /popisky.html;
    }

    location ^~ /search/label/ {
        return 301 /popisky.html;
    }

    # Blogger month archives (/2016/05/) have no equivalent page; the archive
    # page lists every month instead.
    location ~ "^/20[0-9]{2}(/[0-9]{2})?/?$" {
        return 301 /archiv.html;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.html$ {
        expires -1;  # -> Cache-Control: no-cache
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 30d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
